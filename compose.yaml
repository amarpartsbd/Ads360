# Ads360 local development environment (spec §3, §64).
# Production runs the same images behind a load balancer with multiple app nodes.
name: ads360

services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            target: development
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        volumes:
            - .:/var/www/html
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis

    web:
        image: nginx:1.27-alpine
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    # Dedicated queue worker node. Horizon supervises the queues from spec §28.
    horizon:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            target: development
        command: php artisan horizon
        volumes:
            - .:/var/www/html
        depends_on:
            app:
                condition: service_started
            redis:
                condition: service_healthy
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
        restart: unless-stopped

    # Scheduler node. Scheduled jobs take distributed locks (spec §77) so running
    # more than one replica cannot double-execute a task.
    scheduler:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            target: development
        command: php artisan schedule:work
        volumes:
            - .:/var/www/html
        depends_on:
            app:
                condition: service_started
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
        restart: unless-stopped

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-ads360}
            POSTGRES_USER: ${DB_USERNAME:-ads360}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-ads360}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - "${DB_PORT_FORWARD:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ads360}"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        ports:
            - "${REDIS_PORT_FORWARD:-6379}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    vite:
        image: node:22-alpine
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        volumes:
            - .:/var/www/html
        ports:
            - "${VITE_PORT:-5173}:5173"

    # S3-compatible object storage for local development (spec §3 Storage).
    minio:
        image: minio/minio:latest
        command: server /data --console-address ":8900"
        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-ads360}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-ads360secret}
        volumes:
            - minio-data:/data
        ports:
            - "${MINIO_PORT:-9000}:9000"
            - "${MINIO_CONSOLE_PORT:-8900}:8900"

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "${MAILPIT_PORT:-8025}:8025"

volumes:
    postgres-data:
    redis-data:
    minio-data:
