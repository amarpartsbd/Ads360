#
# The production vhost. Rendered by provision.sh, which substitutes
# __APP_DOMAIN__, __APP_DIR__ and __PHP_VERSION__.
#
# Response hardening is the application's job, not this file's: SecurityHeaders
# sets HSTS, CSP, nosniff, framing and referrer policy on every response it
# handles. Setting them here as well would give two places to change one policy
# and, because `add_header` replaces rather than merges, a good chance of the
# two disagreeing.
#

server {
    listen 80;
    listen [::]:80;
    server_name __APP_DOMAIN__;

    # Renewal has to reach this over plain HTTP, so it is answered before the
    # redirect rather than after it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __APP_DOMAIN__;

    root __APP_DIR__/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/__APP_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APP_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    charset utf-8;

    # 15 MiB is the document and creative ceiling (DocumentStorage::MAX_BYTES).
    # The headroom is deliberate: a file just over the limit should be refused
    # by the application, which explains why, rather than by nginx, which
    # returns a bare 413.
    client_max_body_size 20m;

    access_log /var/log/nginx/__APP_DOMAIN__.access.log;
    error_log  /var/log/nginx/__APP_DOMAIN__.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Vite writes content-hashed filenames, so a build's assets can be cached
    # for as long as the browser likes — a new release produces new names.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/ads360.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Tells PHP the request arrived over TLS, which is what makes
        # $request->secure() true and the session cookie's Secure flag honest.
        fastcgi_param HTTPS on;
        # A provider call inside a request can be slow; the queue takes the
        # genuinely long work, so this is a ceiling rather than a target.
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Nothing but index.php is a PHP entry point. Without this a file uploaded
    # anywhere under the document root could be executed.
    location ~ \.php$ {
        return 404;
    }

    # Dotfiles are not served, but the ACME path above still is.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
