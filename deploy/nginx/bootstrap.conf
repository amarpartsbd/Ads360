#
# HTTP-only vhost, used once.
#
# nginx refuses to start against `ssl_certificate` paths that do not exist yet,
# so this stands in until certbot has issued one — it answers the ACME challenge
# and serves the application over plain HTTP so the box can be smoke-tested
# before DNS and TLS are finished. provision.sh replaces it with app.conf.
#
# Rendered by provision.sh, which substitutes __APP_DOMAIN__, __APP_DIR__ and
# __PHP_VERSION__.
#

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __APP_DOMAIN__ _;

    root __APP_DIR__/public;
    index index.php;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    charset utf-8;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/ads360.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
