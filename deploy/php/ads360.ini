;
; PHP settings shared by the FPM pool and the CLI (Horizon, the scheduler and
; artisan run through the CLI, and a setting that differs between the two is a
; bug that only appears on the queue).
;

; Dhaka, matching PLATFORM_DEFAULT_TIMEZONE. Laravel sets its own timezone for
; application code; this is for anything that reads PHP's directly.
date.timezone = Asia/Dhaka

; Hides the PHP version from response headers. Minor, but it costs nothing.
expose_php = Off

; OPcache. The application is deployed as immutable releases and restarted on
; deploy, so timestamps never need checking at runtime.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
; Laravel plus its vendor tree comfortably exceeds the default 10000.
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; JIT is off: this workload is I/O bound on PostgreSQL, Redis and provider HTTP
; calls, so JIT buys close to nothing and adds a class of bug that is hard to
; diagnose in production.
opcache.jit = disable
opcache.jit_buffer_size = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
