;
; The application's own PHP-FPM pool.
;
; Runs as the ads360 user rather than www-data, so nginx — which needs to read
; public/ and nothing else — cannot write application code or read .env. The
; socket is group-owned by www-data so nginx can connect to it.
;
; Sized for a 4 vCPU / 16 GB node. `pm.max_children` is the number that matters:
; too high and a traffic spike swaps, too low and requests queue behind PHP
; while the box is idle. 40 × ~64 MB leaves the database, Redis and Horizon
; comfortable room.
;
[ads360]

user = ads360
group = ads360

listen = /run/php/ads360.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 40
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
; Recycled periodically so a slow leak in any extension cannot accumulate.
pm.max_requests = 500

; Pool health, for diagnosing a saturated pool from the box itself. No vhost
; routes to either path, so they are reachable over the socket (cgi-fcgi) and
; from nowhere on the public internet.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; PHP's own log, separate from the application's. Laravel writes its own.
php_admin_value[error_log] = /var/log/php-fpm-ads360.log
php_admin_flag[log_errors] = on
; Never on in production: a stack trace in an HTTP response is a map of the
; application handed to whoever asked for it.
php_admin_flag[display_errors] = off

; Long-running work belongs on the queue; a web request that needs more than
; this is a bug rather than a request that needs longer.
php_admin_value[max_execution_time] = 60
php_admin_value[memory_limit] = 256M

; The application ceiling is 15 MiB (DocumentStorage::MAX_BYTES). These sit just
; above it so an oversized upload is refused by the application, with a message
; naming the limit, rather than by PHP with an empty $_FILES.
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 20M
